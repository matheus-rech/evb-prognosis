name: Deploy to HuggingFace Spaces

on:
  push:
    branches:
      - master
    paths:
      - 'hf-space/**'

jobs:
  deploy:
    name: Push to HF Spaces (evb-br + evb-brazil)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.21"

      - name: Upload code files to evb-br
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python hf-space/deploy.py mmrech/evb-br

      - name: Upload code files to evb-brazil
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python hf-space/deploy.py mmrech/evb-brazil
