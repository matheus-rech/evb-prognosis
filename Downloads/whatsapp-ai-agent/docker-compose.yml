services:
  app:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./docs:/app/docs:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - whatsapp-net

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: whatsapp_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_user -d whatsapp_agent']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - whatsapp-net

volumes:
  pgdata:

networks:
  whatsapp-net:
    driver: bridge
